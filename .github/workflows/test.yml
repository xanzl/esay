name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: D1/PG repo 方法签名一致性
        run: pnpm check:repo-parity

      - name: D1 全链路测试（node:sqlite 模拟）
        run: pnpm test

      - name: PostgreSQL 全链路测试
        run: pnpm test:pg
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/moment_test
