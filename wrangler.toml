# esay · Cloudflare Workers 部署配置
# 数据库（D1）与存储（R2）绑定由用户在 Cloudflare 后台手动配置，不在此声明：
#   Workers & Pages → 你的 Worker → Settings → Bindings
#   - D1 database：moment-db，绑定名称 DB
#   - R2 bucket：moment-images，绑定名称 R2
# 表结构在应用首次请求时自动创建，管理员账号通过站点初始化页面设置。
# 用法：pnpm build && pnpm deploy
name = "esay"
main = ".output/server/index.mjs"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

# 构建配置：供 Cloudflare 后台（一键部署 / Git 集成）自动预填构建命令与产物目录
[build]
command = "pnpm install && pnpm build"
output = ".output/public"

observability = { enabled = true, head_sampling_rate = 1 }

# 非敏感变量。敏感值（JWT_SECRET / GITHUB_TOKEN）用 wrangler secret put 设置，
# 切勿写入本文件（防止泄露与轮换困难）
[vars]
DB_TYPE = "d1"
STORAGE_TYPE = "r2"
PUBLIC_API_ENABLED = "true"

# Nitro cloudflare_module preset 构建产物中的静态资源
[assets]
binding = "ASSETS"
directory = ".output/public"
run_worker_first = true
